name: Build WOWCast APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships a full Android SDK with licenses accepted.
      # We use it directly instead of android-actions/setup-android (which broke
      # by fetching a newer cmdline-tools that hangs on an interactive license prompt).
      - name: Accept Android SDK licenses (defensive)
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK to wowcast.apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/wowcast.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wowcast-apk
          path: out/wowcast.apk
